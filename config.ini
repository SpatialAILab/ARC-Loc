# ===== VIGOR Configuration =====
[VIGOR]
dataset_root = /data/KHS/VIGOR
; label_root = splits
label_root = splits__corrected

epoch_to_resume = 0

# ===== Model Hyperparameters =====
grd_bev_res = (45,90)

sat_bev_res = 41
num_samples_matches = 512

# ===== Loss Parameters =====
beta = 1.0
loss_grid_size = 5
num_virtual_point = 10

# ===== Image Sizes (Height, Width) =====

; # Radio
ground_image_size = (720, 1440) # vit/16 > 45, 90
satellite_image_size = (656, 656) # vit/16 > 41,41


# BEV grid size in meters
grid_size_h = 71
grid_size_v = 20



; # ===== RANSAC Parameters with ARC =====
th_soft_inlier = 50
th_inlier = 25
num_samples_matches_ransac = 8192
num_corr_2d_2d = 2
it_matches = 20
it_RANSAC_procrustes = 100
num_ref_steps = 4


# ===== Random Seed =====
[RandomSeed]
seed = 0

# ===== Constants =====
[Constants]
epsilon = 1e-10
NewYork_res = 0.113248 
Seattle_res = 0.100817
SanFrancisco_res = 0.118141 
Chicago_res = 0.111262 








# ===== KITTI Configuration =====
[KITTI]
dataset_root = /data/KHS/kitti
train_file = KITTI_splits/train_files.txt
test1_file = KITTI_splits/test1_files.txt
test2_file = KITTI_splits/test2_files.txt
num_thread_workers = 12

learning_rate = 1e-4

# ===== Image Sizes (Height, Width) =====

grid_size_h = 99
grid_size_v = 25

ground_image_size = (368, 1232)
; satellite_image_size = (496, 496)
satellite_image_size = (656, 656)

# ===== Orientation and translation noise =====
rotation_range = 10
shift_range_lat = 20
shift_range_lon = 20


grd_bev_res = (23, 77)
; sat_bev_res = 31
sat_bev_res = 41
num_samples_matches = 512


; # ===== RANSAC Parameters with ARC (KITTI) ===== VIGOR inlier * 1.4 (100/70)
th_soft_inlier = 70 
th_inlier = 35
num_samples_matches_ransac = 8192
num_corr_2d_2d = 2
it_matches = 20
it_RANSAC_procrustes = 100
num_ref_steps = 4
